# Hardened continuous integration for the standalone TotalDrop Android module:
# multi-architecture Rust bridge verification (x86_64 and ARM64), Android NDK
# cross-compilation across all supported ABIs with 16 KB ELF LOAD alignment
# verification, Flutter analyze/format/l10n/test, Android debug APK + Kotlin
# unit tests, Android TV unit tests, version parity, supply-chain auditing
# (cargo-deny), REUSE 3.3 licensing, and secret scanning (gitleaks).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-bridge:
    name: Rust bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Only hand-written crates: ui-m3-expressive/rust/src/frb_generated.rs is generated.
      - name: Format
        run: cargo fmt --check -p totaldrop-crypto -p totaldrop-proto -p totaldrop-core -p totaldrop-l10n
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        env:
          TOTALDROP_REQUIRE_IPV6: "1"
        run: cargo test --workspace --locked
      - name: Validate ABI and version script syntax
        run: |
          bash -n target-*/*.sh
          sh -n tools/check-versions.sh
      - name: Verify Android version and sub-platform parity
        run: ./tools/check-versions.sh
      - name: Verify 10 isolated sub-platform x ABI units
        run: python3 tools/verify-subplatforms.py

  flutter-check:
    name: Flutter analyze, l10n, format & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-m3-expressive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
      - run: flutter pub get --enforce-lockfile
      # Generated from l10n/: must be committed and current.
      - name: Localizations are current
        run: |
          flutter gen-l10n
          dart run tool/gen_locales_config.dart
          dart run tool/gen_android_strings.dart
          git add -N android/app/src/main/res
          git diff --exit-code -- lib/l10n android/app/src/main/res/xml/locales_config.xml 'android/app/src/main/res/values*/l10n.xml'
      - run: flutter analyze
      # Hand-written code only. lib/l10n is written by gen-l10n and checked
      # above; lib/src/rust is written by flutter_rust_bridge.
      - name: Format
        run: |
          find lib test tool -name '*.dart' \
            -not -path 'lib/l10n/*' -not -path 'lib/src/rust/*' -print0 |
            xargs -0 dart format --output=none --set-exit-if-changed
      - name: Test
        run: flutter test
      - name: 16 KB ELF verifier unit tests
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v

  android-debug-kotlin:
    name: Android debug APK, 16 KB ELF & Kotlin tests
    needs: [flutter-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-m3-expressive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Rust toolchain and Android targets
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Verify 16 KB ELF alignment and uncompressed jniLibs
        run: |
          python3 -m unittest discover -s tool -p 'test_*.py'
          python3 tool/check_16kb_elf.py --require-uncompressed build/app/outputs/flutter-apk/app-debug.apk
      - name: Kotlin unit tests
        working-directory: ui-m3-expressive/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  android-tv-tests:
    name: Android TV unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-android-tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
      - name: Run Android TV JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

  android-abi-targets:
    name: Android ABI (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and Android target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Configure Android NDK Clang toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ndk_dir=""
          for candidate in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              ndk_dir="$candidate"
              break
            fi
          done
          if [ -z "$ndk_dir" ]; then
            sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            if [ -n "$sdk" ] && [ -d "$sdk/ndk" ]; then
              ndk_dir=$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            fi
          fi
          if [ -z "$ndk_dir" ] || [ ! -d "$ndk_dir" ]; then
            echo "Preinstalled Android NDK not found" >&2
            exit 1
          fi
          echo "Using Android NDK: $ndk_dir"

          bin_dir="$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin"
          api=31
          libgcc_dir="$RUNNER_TEMP/libgcc_workaround"
          mkdir -p "$libgcc_dir"
          printf 'INPUT(-lunwind)\n' > "$libgcc_dir/libgcc.a"

          base_flags="-L $libgcc_dir -C link-arg=-Wl,--hash-style=both -C link-arg=-Wl,--build-id=sha1"
          case "$TARGET" in
            aarch64-linux-android)
              clang_prefix="aarch64-linux-android${api}"
              cc_triple="aarch64_linux_android"
              cargo_triple="AARCH64_LINUX_ANDROID"
              rustflags="$base_flags -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
              ;;
            armv7-linux-androideabi)
              clang_prefix="armv7a-linux-androideabi${api}"
              cc_triple="armv7_linux_androideabi"
              cargo_triple="ARMV7_LINUX_ANDROIDEABI"
              rustflags="$base_flags -C target-feature=+v7,+thumb-mode,+neon"
              ;;
            x86_64-linux-android)
              clang_prefix="x86_64-linux-android${api}"
              cc_triple="x86_64_linux_android"
              cargo_triple="X86_64_LINUX_ANDROID"
              rustflags="$base_flags -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac

          clang_bin="$bin_dir/${clang_prefix}-clang"
          clangxx_bin="$bin_dir/${clang_prefix}-clang++"
          ar_bin="$bin_dir/llvm-ar"
          ranlib_bin="$bin_dir/llvm-ranlib"
          readelf_bin="$bin_dir/llvm-readelf"

          [ -x "$clang_bin" ] || { echo "Missing NDK Clang wrapper: $clang_bin" >&2; exit 1; }
          [ -x "$ar_bin" ] || { echo "Missing NDK llvm-ar: $ar_bin" >&2; exit 1; }
          [ -x "$readelf_bin" ] || { echo "Missing NDK llvm-readelf: $readelf_bin" >&2; exit 1; }

          echo "$bin_dir" >> "$GITHUB_PATH"
          {
            echo "ANDROID_NDK_HOME=$ndk_dir"
            echo "CC_${cc_triple}=$clang_bin"
            echo "CXX_${cc_triple}=$clangxx_bin"
            echo "AR_${cc_triple}=$ar_bin"
            echo "RANLIB_${cc_triple}=$ranlib_bin"
            echo "CARGO_TARGET_${cargo_triple}_LINKER=$clang_bin"
            echo "CARGO_TARGET_${cargo_triple}_AR=$ar_bin"
            echo "CARGO_TARGET_${cargo_triple}_RUSTFLAGS=$rustflags"
            echo "LLVM_READELF=$readelf_bin"
          } >> "$GITHUB_ENV"
      - name: Build Rust Android bridge (${{ matrix.target }})
        run: cargo build --target ${{ matrix.target }} -p rust_lib_totaldrop --locked --release
      - name: Verify 16 KB ELF LOAD alignment
        if: matrix.target == 'aarch64-linux-android' || matrix.target == 'x86_64-linux-android'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          so="target/$TARGET/release/librust_lib_totaldrop.so"
          [ -f "$so" ] || { echo "Built shared library not found: $so" >&2; exit 1; }
          readelf_bin="${LLVM_READELF:-readelf}"
          "$readelf_bin" -lW "$so"
          loads=$("$readelf_bin" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          [ -n "$loads" ] || { echo "No ELF PT_LOAD segments found in $so" >&2; exit 1; }
          for align in $loads; do
            bytes=$((align))
            if [ "$bytes" -lt 16384 ] || [ $((bytes % 16384)) -ne 0 ]; then
              echo "PT_LOAD segment alignment $align ($bytes bytes) is below 16 KB (0x4000)" >&2
              exit 1
            fi
          done
          echo "Verified all ELF PT_LOAD segments in $so are 16 KB (0x4000) aligned."

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: ./tools/check-spdx.sh
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..HEAD
          else
            base=HEAD range=HEAD
          fi
          echo "Scanning $range"
          { echo "BASE=$base"; echo "RANGE=$range"; } >>"$GITHUB_ENV"
      - name: No signing keys, key.properties or .gitleaksignore
        run: |
          found=$(
            { git ls-files -z
              git -c core.quotePath=false log --format= --name-only -z --no-renames --diff-filter=d "$RANGE"
            } | grep -ziE '(^|/)(key\.properties|\.gitleaksignore)$|\.(jks|keystore|p12|pfx|pepk)$' | tr '\0' '\n' | sort -u
          )
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Signing keys, key.properties and .gitleaksignore must not be committed."
            exit 1
          fi
      - name: gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          cfg=$RUNNER_TEMP/gitleaks
          mkdir -p "$cfg"
          if ! git show "$BASE:.gitleaks.toml" >"$cfg/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' >"$cfg/gitleaks.toml"
          fi
          docker run --rm --volume "$PWD/.git:/repo/.git:ro" --volume "$cfg:/cfg:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --config /cfg/gitleaks.toml \
            --gitleaks-ignore-path /cfg --ignore-gitleaks-allow \
            --log-opts="--text $RANGE" /repo

  gate:
    name: CI
    if: always()
    needs:
      - rust-bridge
      - flutter-check
      - android-debug-kotlin
      - android-tv-tests
      - android-abi-targets
      - deny
      - reuse
      - secrets
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
