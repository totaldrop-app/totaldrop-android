#
# Dedicated sub-platform x CPU cloud packaging & Sigstore provenance workflow
# for `android-split-apk-armeabi-v7a` (`totaldrop-android`, ADR 0020).
name: Package (split-apk / armeabi-v7a)

on:
  push:
    tags:
      - "android-split-apk-armeabi-v7a-v*"
  pull_request:
    paths:
      - "subplatforms/split-apk/armeabi-v7a/**"
      - ".github/workflows/pkg-split-apk-armeabi-v7a.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg-split-apk-armeabi-v7a-${{ github.ref }}
  cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/') }}"

jobs:
  package:
    name: Build & Verify (split-apk / armeabi-v7a)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate isolated sub-platform recipe (android-split-apk-armeabi-v7a)
        shell: bash
        run: |
          sh subplatforms/split-apk/armeabi-v7a/build.sh --check-recipe
          sh subplatforms/split-apk/armeabi-v7a/verify.sh --check-recipe
      - name: Stage deterministic sub-platform artifact & SHA256SUMS
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1760000000"
        run: |
          stage_dir="$RUNNER_TEMP/stage-split-apk-armeabi-v7a"
          out_dir="$RUNNER_TEMP/dist-split-apk-armeabi-v7a"
          mkdir -p "$stage_dir" "$out_dir"
          printf 'unit=%s\nsha=%s\n' "android-split-apk-armeabi-v7a" "$GITHUB_SHA" >"$stage_dir/SOURCE_COMMIT.txt"
          sh subplatforms/split-apk/armeabi-v7a/build.sh --package-staged "$stage_dir" "$out_dir"
          sh subplatforms/split-apk/armeabi-v7a/verify.sh "$out_dir"
      - name: Upload sub-platform artifact & SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-split-apk-armeabi-v7a
          path: |
            ${{ runner.temp }}/dist-split-apk-armeabi-v7a/totaldrop-android-0.4.0-beta.1-armeabi-v7a.apk
            ${{ runner.temp }}/dist-split-apk-armeabi-v7a/SHA256SUMS
          if-no-files-found: error
      - name: Attest Sigstore OIDC build provenance on release tags
        if: startsWith(github.ref, 'refs/tags/android-split-apk-armeabi-v7a-v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist-split-apk-armeabi-v7a/totaldrop-android-0.4.0-beta.1-armeabi-v7a.apk
